name: Refresh budget data
on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Refresh national projects snapshot
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Fetch snapshot
        run: node scripts/fetch-budget.js

      - name: Open pull request if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # fetchedAt changes on every run; only open a PR when the data differs.
          git diff --quiet -I'"fetchedAt"' -- public/data/budget-hermosa.json && exit 0
          branch="chore/refresh-budget-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/budget-hermosa.json
          git commit -m "chore: refresh national projects budget snapshot"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          gh pr create --repo "$REPO" --head "$branch" --base main \
            --title "chore: refresh national projects budget snapshot" \
            --body "Monthly refresh of public/data/budget-hermosa.json from the Philippine Budget Data API. Review the diff before merging."
